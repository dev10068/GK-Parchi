name: Daily Current Affairs Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # ~7:00 AM IST daily. Remove this block if you only want manual runs.

jobs:
  generate-current-affairs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Current Affairs generator
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affairs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: daily current affairs update"
            git push
          fi
