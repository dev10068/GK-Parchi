name: Daily Current Affairs Automation

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST, every day
    - cron: "30 0 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the generated .md file back

jobs:
  generate-current-affairs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Current Affairs generator
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push generated files
        run: |
          git config user.name "current-affairs-bot"
          git config user.email "actions@github.com"
          git add affairs/
          git diff --staged --quiet || git commit -m "Add current affairs for $(date +'%d-%m-%Y')"
          git push
