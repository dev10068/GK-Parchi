<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GK Parchi — Daily Current Affairs</title>
<meta name="description" content="Daily current affairs parchi for SSC, Railway and other competitive exams." />

<!-- Markdown renderer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<!-- Fonts: Manrope for display, Inter for body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Set theme before paint, to avoid a light-mode flash -->
<script>
  (function () {
    const saved = localStorage.getItem("gkp-theme");
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<style>
  :root{
    --slate-950:#0b1220;
    --slate-900:#0f172a;
    --slate-800:#1e293b;
    --slate-700:#334155;
    --slate-500:#64748b;
    --slate-300:#cbd5e1;
    --slate-200:#e2e8f0;
    --slate-100:#f1f5f9;
    --slate-50:#f8fafc;
    --blue-600:#2563eb;
    --blue-500:#3b82f6;
    --blue-50:#eff6ff;
    --radius:10px;
    --sidebar-w:300px;

    /* ---- Theme-aware tokens (light defaults) ---- */
    --page-bg:var(--slate-50);
    --page-text:var(--slate-800);
    --card-bg:#fffdf8;
    --card-border:var(--slate-200);
    --heading-color:var(--slate-900);
    --topbar-bg:var(--slate-50);
    --code-bg:var(--blue-50);
    --code-text:var(--blue-600);
    --blockquote-bg:var(--blue-50);
    --table-header-bg:var(--slate-100);
    --hamburger-bg:#fff;
    --hamburger-border:var(--slate-200);
    --hamburger-bar:var(--slate-800);
  }

  :root[data-theme="dark"]{
    --page-bg:#0b1220;
    --page-text:#cbd5e1;
    --card-bg:#111c2e;
    --card-border:#24334a;
    --heading-color:#f1f5f9;
    --topbar-bg:#0b1220;
    --code-bg:rgba(59,130,246,0.16);
    --code-text:#7cb0ff;
    --blockquote-bg:rgba(59,130,246,0.12);
    --table-header-bg:#16223a;
    --hamburger-bg:#111c2e;
    --hamburger-border:#24334a;
    --hamburger-bar:#e2e8f0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--page-bg);
    color:var(--page-text);
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }

  a{color:inherit;}

  /* ---------- App shell ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar (stays dark navy in both themes) ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--slate-900);
    color:var(--slate-200);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }

  .sidebar-header{
    padding:24px 20px 16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:8px;
    background:linear-gradient(155deg,var(--blue-500),var(--blue-600));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    flex-shrink:0;
    clip-path:polygon(0 6%,50% 0,100% 6%,100% 94%,50% 100%,0 94%);
  }

  .brand-text h1{
    font-family:'Manrope',sans-serif;
    font-size:16px;
    font-weight:800;
    margin:0;
    color:#fff;
    letter-spacing:0.2px;
  }

  .brand-text p{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--slate-500);
  }

  .archive-label{
    padding:18px 20px 8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--slate-500);
  }

  .archive-list{
    list-style:none;
    margin:0;
    padding:0 12px 16px;
    overflow-y:auto;
    flex:1;
  }

  .archive-list::-webkit-scrollbar{width:6px;}
  .archive-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px;}

  .parchi-item{
    position:relative;
    margin:6px 0;
    padding:11px 14px 11px 16px;
    border-radius:8px;
    cursor:pointer;
    background:rgba(255,255,255,0.03);
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }

  .parchi-item::before{
    content:"";
    position:absolute;
    left:0;
    top:8px;
    bottom:8px;
    width:3px;
    border-radius:2px;
    background:transparent;
    transition:background .15s ease;
  }

  .parchi-item:hover{
    background:rgba(255,255,255,0.06);
  }

  .parchi-item.active{
    background:var(--blue-600);
    border-color:var(--blue-500);
  }

  .parchi-item.active::before{
    background:#fff;
  }

  .parchi-date{
    font-size:13.5px;
    font-weight:600;
    color:#fff;
  }

  .parchi-item.active .parchi-date{color:#fff;}
  .parchi-item:not(.active) .parchi-date{color:var(--slate-200);}

  .parchi-tag{
    display:block;
    margin-top:3px;
    font-size:11.5px;
    color:var(--slate-500);
  }

  .parchi-item.active .parchi-tag{color:rgba(255,255,255,0.75);}

  .sidebar-footer{
    padding:14px 20px;
    border-top:1px solid rgba(255,255,255,0.08);
    font-size:11px;
    color:var(--slate-500);
  }

  /* ---------- Topbar (mobile) ---------- */
  .topbar{
    display:none;
    position:sticky;
    top:0;
    z-index:20;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:var(--topbar-bg);
    border-bottom:1px solid var(--card-border);
  }

  .icon-btn{
    width:38px;
    height:38px;
    border-radius:8px;
    border:1px solid var(--hamburger-border);
    background:var(--hamburger-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .hamburger span{
    display:block;
    width:16px;
    height:2px;
    background:var(--hamburger-bar);
    position:relative;
  }
  .hamburger span::before,.hamburger span::after{
    content:"";
    position:absolute;
    left:0;
    width:16px;
    height:2px;
    background:var(--hamburger-bar);
  }
  .hamburger span::before{top:-5px;}
  .hamburger span::after{top:5px;}

  .topbar-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--heading-color);
  }

  .topbar-spacer{ flex:1; }

  /* ---------- Theme toggle button ---------- */
  .theme-toggle{
    position:relative;
    width:38px;
    height:38px;
    flex-shrink:0;
  }
  .theme-toggle svg{
    width:18px;
    height:18px;
    stroke:var(--hamburger-bar);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .theme-toggle .icon-sun{ display:none; }
  .theme-toggle .icon-moon{ display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }

  /* Desktop toggle sits in the sidebar footer */
  .sidebar-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .sidebar-footer .theme-toggle{
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    background:rgba(255,255,255,0.04);
  }
  .sidebar-footer .theme-toggle svg{ stroke:var(--slate-300); }

  /* Mobile topbar toggle, hidden on desktop (sidebar footer one is used instead) */
  .topbar .theme-toggle{ display:none; }

  /* ---------- Main content ---------- */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    justify-content:center;
    padding:48px 32px 80px;
  }

  .content-card{
    width:100%;
    max-width:760px;
  }

  .content-eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }

  .eyebrow-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--blue-600);
  }

  .eyebrow-text{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--blue-600);
  }

  #content-title{
    font-family:'Manrope',sans-serif;
    font-size:clamp(22px,3vw,30px);
    font-weight:800;
    color:var(--heading-color);
    margin:0 0 16px;
    line-height:1.25;
  }

  /* Quick-nav chips, built from the digest's own category headings */
  .quick-nav{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
  }
  .quick-nav a{
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    background:var(--code-bg);
    color:var(--code-text);
    text-decoration:none;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .quick-nav a:hover{
    border-color:var(--blue-500);
  }

  /* Markdown body */
  #markdown-body{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:36px 40px;
    line-height:1.75;
    font-size:15.5px;
    color:var(--page-text);
  }

  #markdown-body h1,#markdown-body h2,#markdown-body h3{
    font-family:'Manrope',sans-serif;
    color:var(--heading-color);
    font-weight:700;
    line-height:1.35;
  }
  #markdown-body h1{font-size:22px;margin:0 0 14px;}
  #markdown-body h2{font-size:18.5px;margin:28px 0 12px;padding-top:14px;border-top:1px solid var(--card-border);scroll-margin-top:24px;}
  #markdown-body h2:first-child{border-top:none;padding-top:0;margin-top:0;}
  #markdown-body h3{font-size:16px;margin:20px 0 8px;}
  #markdown-body p{margin:0 0 14px;}
  #markdown-body ul,#markdown-body ol{margin:0 0 16px;padding-left:22px;}
  #markdown-body li{margin-bottom:6px;}
  #markdown-body strong{color:var(--heading-color);font-weight:700;}
  #markdown-body code{
    background:var(--code-bg);
    color:var(--code-text);
    padding:2px 6px;
    border-radius:4px;
    font-size:0.9em;
  }
  #markdown-body blockquote{
    margin:0 0 16px;
    padding:10px 16px;
    border-left:3px solid var(--blue-500);
    background:var(--blockquote-bg);
    color:var(--page-text);
    border-radius:0 6px 6px 0;
  }
  #markdown-body a{color:var(--blue-600);text-decoration:underline;text-underline-offset:2px;}
  #markdown-body hr{border:none;border-top:1px solid var(--card-border);margin:24px 0;}
  #markdown-body table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14.5px;}
  #markdown-body th,#markdown-body td{border:1px solid var(--card-border);padding:8px 10px;text-align:left;}
  #markdown-body th{background:var(--table-header-bg);font-weight:700;color:var(--heading-color);}

  /* Compact styling for the raw Top Headlines list — it can have 50-80
     entries with no summarizing, so it needs a tighter, scannable look
     rather than the same spacing as the detailed digest points. */
  #markdown-body ol.headlines-list{
    font-size:13.5px;
    line-height:1.5;
    padding-left:20px;
  }
  #markdown-body ol.headlines-list li{
    margin-bottom:8px;
  }
  #markdown-body ol.headlines-list li em{
    color:var(--slate-500);
    font-style:normal;
    font-size:12px;
  }

  .state-msg{
    padding:40px;
    text-align:center;
    color:var(--slate-500);
    font-size:14.5px;
  }

  /* ---------- Overlay for mobile sidebar ---------- */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.45);
    z-index:15;
  }

  /* ---------- Back-to-top button ---------- */
  .back-to-top{
    position:fixed;
    bottom:24px;
    right:24px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--blue-600);
    border:none;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:30;
  }
  .back-to-top.show{ display:flex; }
  .back-to-top svg{
    width:18px;height:18px;
    stroke:#fff;
    fill:none;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .topbar{display:flex;}
    .topbar .theme-toggle{ display:flex; }
    .sidebar-footer .theme-toggle{ display:none; }
    .sidebar{
      position:fixed;
      left:0;
      top:0;
      z-index:25;
      transform:translateX(-100%);
      transition:transform .25s ease;
      width:280px;
      box-shadow:8px 0 24px rgba(0,0,0,0.15);
    }
    .sidebar.open{transform:translateX(0);}
    .overlay.show{display:block;}
    .main{padding:28px 16px 64px;}
    #markdown-body{padding:24px 20px;}
    .back-to-top{bottom:16px;right:16px;}
  }

  :focus-visible{
    outline:2px solid var(--blue-600);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">GK</div>
        <div class="brand-text">
          <h1>GK Parchi</h1>
          <p>Daily current affairs, exam-ready</p>
        </div>
      </div>
    </div>

    <div class="archive-label">Archive</div>
    <ul class="archive-list" id="archive-list">
      <li class="state-msg" style="color:#64748b;padding:12px 8px;">Loading dates…</li>
    </ul>

    <div class="sidebar-footer">
      <span>Built for SSC CGL &amp; Railway aspirants</span>
      <button class="icon-btn theme-toggle" id="theme-toggle-desktop" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap" style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <div class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Open archive menu"><span></span></button>
      <div class="topbar-title">GK Parchi</div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn theme-toggle" id="theme-toggle-mobile" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

    <main class="main">
      <div class="content-card">
        <div class="content-eyebrow">
          <span class="eyebrow-dot"></span>
          <span class="eyebrow-text" id="content-eyebrow">Today's Parchi</span>
        </div>
        <h2 id="content-title" style="border:none;padding:0;">Loading…</h2>
        <div class="quick-nav" id="quick-nav"></div>
        <div id="markdown-body">
          <div class="state-msg">Fetching latest current affairs…</div>
        </div>
      </div>
    </main>
  </div>

</div>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function () {
  "use strict";

  // ---- Dark mode toggle ----
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("gkp-theme", theme);
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(current === "dark" ? "light" : "dark");
  }
  document.getElementById("theme-toggle-desktop").addEventListener("click", toggleTheme);
  document.getElementById("theme-toggle-mobile").addEventListener("click", toggleTheme);

  // ---- Back to top ----
  const backToTopEl = document.getElementById("back-to-top");
  window.addEventListener("scroll", () => {
    if (window.scrollY > 400) backToTopEl.classList.add("show");
    else backToTopEl.classList.remove("show");
  });
  backToTopEl.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---- Config ----
  // main.py writes affairs/latest.json in this shape:
  // {
  //   "latest_date": "04-07-2026",
  //   "latest_file": "Current_Affairs_04-07-2026.md",
  //   "archive": [
  //     { "date": "04-07-2026", "file": "Current_Affairs_04-07-2026.md" },
  //     ...
  //   ]
  // }
  // The digest markdown now ends with a "## Top Headlines" section (raw,
  // undeduped-by-category headlines) — it renders automatically since it's
  // just another h2 block, but we give it compact styling and a quick-nav
  // chip below.
  const DATA_INDEX_URL = "affairs/latest.json";
  const FILES_BASE = "affairs/";

  const archiveListEl = document.getElementById("archive-list");
  const markdownBodyEl = document.getElementById("markdown-body");
  const contentTitleEl = document.getElementById("content-title");
  const contentEyebrowEl = document.getElementById("content-eyebrow");
  const quickNavEl = document.getElementById("quick-nav");
  const sidebarEl = document.getElementById("sidebar");
  const overlayEl = document.getElementById("overlay");
  const hamburgerEl = document.getElementById("hamburger");

  let entries = [];
  let activeFile = null;

  function openSidebar() {
    sidebarEl.classList.add("open");
    overlayEl.classList.add("show");
  }
  function closeSidebar() {
    sidebarEl.classList.remove("open");
    overlayEl.classList.remove("show");
  }
  hamburgerEl.addEventListener("click", openSidebar);
  overlayEl.addEventListener("click", closeSidebar);

  function renderArchiveList() {
    archiveListEl.innerHTML = "";
    entries.forEach((entry, i) => {
      const li = document.createElement("li");
      li.className = "parchi-item" + (entry.file === activeFile ? " active" : "");
      li.setAttribute("role", "button");
      li.setAttribute("tabindex", "0");

      const dateDiv = document.createElement("div");
      dateDiv.className = "parchi-date";
      dateDiv.textContent = entry.date;

      const tagDiv = document.createElement("div");
      tagDiv.className = "parchi-tag";
      tagDiv.textContent = i === 0 ? "Latest" : entry.date;

      li.appendChild(dateDiv);
      li.appendChild(tagDiv);

      const activate = () => loadEntry(entry, i === 0);
      li.addEventListener("click", activate);
      li.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
      });

      archiveListEl.appendChild(li);
    });
  }

  // Assigns anchor ids to each category heading, builds the quick-nav
  // chip row from them, and tags the Top Headlines list for compact CSS.
  function enhanceContent() {
    const headings = markdownBodyEl.querySelectorAll("h2");
    quickNavEl.innerHTML = "";

    headings.forEach((h) => {
      const text = h.textContent.trim();
      const id = text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      h.id = id;

      const chip = document.createElement("a");
      chip.href = "#" + id;
      chip.textContent = text;
      chip.addEventListener("click", (e) => {
        e.preventDefault();
        h.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      quickNavEl.appendChild(chip);

      if (text === "Top Headlines") {
        const nextEl = h.nextElementSibling;
        if (nextEl && nextEl.tagName === "OL") {
          nextEl.classList.add("headlines-list");
        }
      }
    });
  }

  async function loadEntry(entry, isLatest) {
    activeFile = entry.file;
    contentEyebrowEl.textContent = isLatest ? "Today's Parchi" : "Archive";
    contentTitleEl.textContent = entry.date;
    markdownBodyEl.innerHTML = '<div class="state-msg">Loading content…</div>';
    quickNavEl.innerHTML = "";
    renderArchiveList();
    closeSidebar();

    try {
      const res = await fetch(FILES_BASE + entry.file, { cache: "no-cache" });
      if (!res.ok) throw new Error("File not found: " + entry.file);
      const mdText = await res.text();
      markdownBodyEl.innerHTML = marked.parse(mdText);
      enhanceContent();
    } catch (err) {
      markdownBodyEl.innerHTML =
        '<div class="state-msg">Couldn\'t load this parchi. Please check that <code>' +
        FILES_BASE + entry.file + "</code> exists.</div>";
      console.error(err);
    }
  }

  async function init() {
    try {
      const res = await fetch(DATA_INDEX_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("Could not load latest.json");
      const data = await res.json();

      entries = Array.isArray(data.archive) ? [...data.archive] : [];
      if (data.latest_file && !entries.some(e => e.file === data.latest_file)) {
        entries.unshift({ date: data.latest_date, file: data.latest_file });
      }

      if (entries.length === 0) {
        archiveListEl.innerHTML = '<li class="state-msg" style="color:#64748b;padding:12px 8px;">No entries yet.</li>';
        markdownBodyEl.innerHTML = '<div class="state-msg">No current affairs entries found.</div>';
        return;
      }

      renderArchiveList();
      loadEntry(entries[0], true); // auto-load latest on landing
    } catch (err) {
      archiveListEl.innerHTML = '<li class="state-msg" style="color:#64748b;padding:12px 8px;">Could not load archive.</li>';
      markdownBodyEl.innerHTML =
        '<div class="state-msg">Could not load <code>affairs/latest.json</code>. Make sure the workflow has run at least once.</div>';
      console.error(err);
    }
  }

  init();
})();
</script>

</body>
